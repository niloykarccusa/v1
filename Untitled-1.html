<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/customstyle.css" rel="stylesheet" type="text/css" />
    <style>
      #page1 {
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 50px;
        position: absolute;
        z-index: 1;
        overflow: hidden;
        /*            background-color: white;*/
      }

      body {
        height: 100vh;
        background: #fff;
        overflow: hidden;
      }

      .logo {
        position: relative;
        width: 200px;
        height: 200px;
      }
    </style>
  </head>

  <body>
    <div id="page1">
      <div id="expo">
        <!--            <img src="images/logo-new.png" alt="" class="w-100">-->
        <img src="images/2.png" alt="" class="w-100" />
      </div>
    </div>
    <section class="banner-site position-relative">
      <img src="images/banner.png" alt="banner-img" class="w-100" />
      <div class="container custom-container position-absolute">
        <div class="row">
          <div class="col-12">
            <div class="banner-content">
              <div class="">
                <h2>Custom Built Homes with Experience</h2>
              </div>
              <div class="row">
                <div class="col-md-7">
                  <p>
                    A home is more than a structure — it’s where life unfolds.
                    From morning hallway races to quiet coffee moments, your
                    home should reflect the life you’re building inside it.
                  </p>
                </div>
                <div
                  class="col-md-5 d-flex justify-content-end align-items-center"
                >
                  <a href="#" class="project-btn">View Project</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/EasePack.min.js"></script>

    <script>
      gsap.registerPlugin(EasePack);

      gsap.fromTo(
        "#expo img",
        {
          scale: 0.1,
        },
        {
          scale: 8,
          duration: 7,
          fade: 0.7,
          ease: "expoScale(1, 12)",
          repeat: -1,
        },
      );
    </script>
  </body>
</html>
